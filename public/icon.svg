<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35" />

  <!-- Outer circuit aura glow -->
  <circle cx="256" cy="256" r="180" fill="#10b981" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Bot Ledger Grid & Circuit lines -->
  <path d="M120 180 H180 L210 140 H302 L332 180 H392" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6,6" />
  <path d="M120 340 H190 L220 370 H292 L322 340 H392" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6,6" />

  <!-- Shield / Ledger Core -->
  <path d="M256 90 L380 150 V270 C380 345 325 408 256 430 C187 408 132 345 132 270 V150 Z" 
        fill="#09131e" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Internal Candlestick / Bar Chart Growth Bars -->
  <!-- Bar 1 (Left - Blue Inflow) -->
  <rect x="184" y="240" width="22" height="70" rx="6" fill="url(#cyanGrad)" />
  <line x1="195" y1="222" x2="195" y2="325" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Bar 2 (Center - High Emerald Sprout) -->
  <rect x="245" y="180" width="22" height="130" rx="6" fill="url(#primaryGrad)" filter="url(#glow)" />
  <line x1="256" y1="155" x2="256" y2="330" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

  <!-- Bar 3 (Right - Target Gold) -->
  <rect x="306" y="210" width="22" height="100" rx="6" fill="url(#goldGrad)" />
  <line x1="317" y1="190" x2="317" y2="325" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />

  <!-- Trend Up Arrow Line -->
  <path d="M170 290 Q230 230 290 190 L345 155" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <polygon points="345,140 360,170 330,165" fill="#ffffff" />

  <!-- Sprout Node at Top -->
  <path d="M256 120 C240 100 240 80 256 70 C272 80 272 100 256 120 Z" fill="#34d399" />
  <circle cx="256" cy="120" r="6" fill="#6ee7b7" />
</svg>
